<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>MOAG</title>
  <link rel="stylesheet" href="/assets/theme.css">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="app" class="app">
    <header id="app-header" class="app-header"></header>
    <div class="app-body">
      <aside id="app-rail" class="app-rail" hidden></aside>
      <main id="main" class="app-main" tabindex="-1"></main>
    </div>
  </div>
  <p class="narrow-banner">MOAG is designed for tablet and desktop.</p>
  <div id="live-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="live-assertive" class="sr-only" aria-live="assertive" aria-atomic="true"></div>
  <div id="toasts" class="toasts"></div>
  <noscript><p>MOAG needs JavaScript enabled.</p></noscript>
</body>
</html>
