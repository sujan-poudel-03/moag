name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run compile

  test-unit:
    strategy:
      # Never cancel the other platforms: this matrix exists to compare them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The suite asserts things about the SHIPPED artifacts — that every webview
      # script is emitted, parses, and is a plain browser script — so out/ has to
      # exist before it runs. Without this the guards fail on every platform.
      - run: npm run compile
      - run: npm run test:unit

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Package the extension
        run: npx @vscode/vsce package -o moag.vsix
      # Tests run against the repo's out/; the VSIX holds only what .vscodeignore lets
      # through. 0.9.13 and 0.9.14 shipped an extension that could not activate
      # ("Cannot find module '../server/secrets'") while every test passed. The smoke
      # script unzips this exact file, checks its contents, loads package.json main
      # with a stub vscode, and runs bin.moag --help and a verify (scripts/smoke-vsix.mjs).
      - name: Smoke-test the packaged VSIX
        run: npm run smoke:vsix -- --vsix moag.vsix

  test-integration:
    needs: build
    strategy:
      # Never cancel the other platforms: this matrix exists to compare them.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run compile
      # The current VS Code on every platform (labels are in .vscode-test.mjs).
      - run: xvfb-run -a npm run test:integration -- --label stable
        if: runner.os == 'Linux'
      - run: npm run test:integration -- --label stable
        if: runner.os != 'Linux'
      # The oldest VS Code engines.vscode admits, once, on Linux.
      - run: xvfb-run -a npm run test:integration -- --label minimum
        if: runner.os == 'Linux'
